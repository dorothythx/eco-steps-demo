<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eco Steps - Admin Review</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  :root {
    --forest: #1b4332;
    --pine: #2d6a4f;
    --leaf: #52b788;
    --leaf-light: #95d5b2;
    --mint: #d8f3dc;
    --cream: #f8f5e9;
    --sun: #f4d35e;
    --sun-soft: #fff4bd;
    --muted: #6b7c72;
    --white: #ffffff;
    --danger: #c85c5c;

    --shadow-sm: 0 4px 12px rgba(27, 67, 50, .07);
    --shadow-md: 0 12px 28px rgba(27, 67, 50, .10);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--forest);

    background:
      radial-gradient(circle at 8% 12%,
        rgba(149, 213, 178, .28) 0 70px,
        transparent 71px),
      radial-gradient(circle at 92% 88%,
        rgba(244, 211, 94, .18) 0 90px,
        transparent 91px),
      var(--cream);
  }

  .container {
    width: min(1080px, calc(100% - 32px));
    margin: 0 auto;
    padding: 42px 0 60px;
  }

  /* =========================
     HEADER
     ========================= */

  .container > h1 {
    margin: 0;
    text-align: left;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -.5px;
  }

  .container > h1::first-letter {
    font-size: 1.05em;
  }

  #loading {
    margin: 8px 0 28px;
    color: var(--muted);
    font-size: .95rem;
  }

  /* =========================
     DECORATIVE HEADER LINE
     ========================= */

  .container::after {
    content: "🌿  ตรวจสอบภารกิจ • อนุมัติคะแนน • ดูแลก้าวเล็ก ๆ ของนักเรียน  🌱";
    display: block;
    margin-top: 26px;
    padding: 14px 18px;

    border-radius: 16px;
    background: var(--mint);
    color: var(--pine);

    font-size: .85rem;
    font-weight: 700;
    text-align: center;
  }

  /* =========================
     SUBMISSION CARD
     ========================= */

  .submission {
    position: relative;

    margin: 18px 0;
    padding: 24px;

    background: var(--white);
    border: 1px solid rgba(82, 183, 136, .18);
    border-radius: 24px;

    box-shadow: var(--shadow-sm);

    overflow: hidden;

    transition:
      transform .2s ease,
      box-shadow .2s ease,
      border-color .2s ease;
  }

  .submission:hover {
    transform: translateY(-4px);
    border-color: rgba(82, 183, 136, .35);
    box-shadow: var(--shadow-md);
  }

  /* little decorative leaf */
  .submission::before {
    content: "🍃";
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 1.7rem;
    opacity: .25;
    transform: rotate(15deg);
  }

  .submission h2 {
    margin: 0 0 18px;
    padding-right: 40px;

    color: var(--forest);
    font-size: 1.25rem;
    font-weight: 800;
  }

  /* =========================
     INFO
     ========================= */

  .info {
    display: flex;
    align-items: baseline;
    gap: 8px;

    margin: 9px 0;

    color: var(--muted);
    font-size: .92rem;
    line-height: 1.5;
  }

  .info b {
    min-width: 90px;
    color: var(--forest);
  }

  /* =========================
     STATUS
     ========================= */

  .info:nth-last-of-type(1) {
    display: inline-flex;
    margin-top: 14px;
    padding: 6px 11px;

    border-radius: 999px;
    background: var(--sun-soft);
    color: var(--forest);

    font-size: .78rem;
    font-weight: 800;
  }

  /* =========================
     BUTTONS
     ========================= */

  button {
    min-height: 44px;
    padding: 10px 18px;

    border: 0;
    border-radius: 14px;

    cursor: pointer;

    font-family: inherit;
    font-size: .88rem;
    font-weight: 800;

    transition:
      transform .18s ease,
      box-shadow .18s ease,
      opacity .18s ease;
  }

  button:hover {
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  .approve {
    background: var(--pine);
    color: white;

    box-shadow:
      0 5px 12px rgba(45, 106, 79, .2);
  }

  .approve:hover {
    background: var(--forest);
    box-shadow:
      0 8px 16px rgba(45, 106, 79, .25);
  }

  .reject {
    background: #f3f5f3;
    color: var(--danger);
    border: 1px solid #e4e9e5;
  }

  .reject:hover {
    background: #fceeee;
  }

  /* =========================
     EMPTY STATE
     ========================= */

  #submissionList > p {
    margin: 30px 0;
    padding: 38px 20px;

    text-align: center;

    background: rgba(255,255,255,.8);
    border: 1px dashed var(--leaf-light);
    border-radius: 22px;

    color: var(--pine);
    font-weight: 700;
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 600px) {

    .container {
      width: min(100% - 22px, 560px);
      padding: 26px 0 40px;
    }

    .container > h1 {
      font-size: 1.65rem;
    }

    .container::after {
      font-size: .76rem;
      line-height: 1.6;
    }

    .submission {
      padding: 20px 17px;
      border-radius: 20px;
    }

    .submission h2 {
      font-size: 1.05rem;
      margin-bottom: 16px;
    }

    .info {
      display: block;
      margin: 10px 0;
      font-size: .85rem;
    }

    .info b {
      display: inline-block;
      min-width: 76px;
    }

    button {
      width: 100%;
      margin: 5px 0;
    }
  }
</style>
</head>

<body>

<div class="container">

  <h1>🌱 Eco Steps Admin Review</h1>

  <p id="loading">กำลังโหลดรายการ...</p>

  <div id="submissionList"></div>

</div>

<script>

const SUPABASE_URL = "https://rcyhzhrfzmxiqqtubxzs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DxfpxxjOan0XCrETEq8kXQ_4s2o7suI";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// โหลดภารกิจที่รอตรวจ
async function loadSubmissions() {

  const { data, error } = await supabaseClient
    .from("submissions")
    .select(`
      id,
      user_id,
      mission_id,
      description,
      status,
      created_at,
      profiles (
        full_name,
        class_name,
        student_code
      ),
      missions (
        title,
        points
      )
    `)
    .eq("status", "pending")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    document.getElementById("loading").textContent =
      "โหลดข้อมูลไม่สำเร็จ";
    return;
  }

  document.getElementById("loading").style.display = "none";

  const list = document.getElementById("submissionList");

  if (!data || data.length === 0) {
    list.innerHTML = "<p>🎉 ไม่มีภารกิจที่รอตรวจ</p>";
    return;
  }

  list.innerHTML = "";

  data.forEach(item => {

    const profile = item.profiles;
    const mission = item.missions;

    const card = document.createElement("div");

    card.className = "submission";

    card.innerHTML = `
      <h2>🌱 ${mission?.title || "ไม่พบชื่อภารกิจ"}</h2>

      <div class="info">
        <b>นักเรียน:</b>
        ${profile?.full_name || "-"}
      </div>

      <div class="info">
        <b>ชั้น:</b>
        ${profile?.class_name || "-"}
      </div>

      <div class="info">
        <b>รหัส:</b>
        ${profile?.student_code || "-"}
      </div>

      <div class="info">
        <b>คำอธิบาย:</b>
        ${item.description || "-"}
      </div>

      <div class="info">
        <b>สถานะ:</b>
        ${item.status}
      </div>

      <br>

      <button
        class="approve"
        onclick="approveSubmission('${item.id}')">
        ✅ อนุมัติ +5 คะแนน
      </button>

      <button
        class="reject"
        onclick="rejectSubmission('${item.id}')">
        ❌ ไม่อนุมัติ
      </button>
    `;

    list.appendChild(card);
  });
}


// อนุมัติ
async function approveSubmission(id) {

  const { data, error } = await supabaseClient
    .rpc("approve_submission", {
      submission_id: id
    });

  if (error) {
    console.error(error);
    alert("อนุมัติไม่สำเร็จ");
    return;
  }

  if (!data.success) {
    alert(data.message);
    return;
  }

  alert("อนุมัติสำเร็จ! นักเรียนได้รับ 5 คะแนน 🌱");

  loadSubmissions();
}


// ไม่อนุมัติ
async function rejectSubmission(id) {

  const { error } = await supabaseClient
    .from("submissions")
    .update({
      status: "rejected",
      reviewed_at: new Date().toISOString()
    })
    .eq("id", id);

  if (error) {
    console.error(error);
    alert("ไม่สามารถปฏิเสธภารกิจได้");
    return;
  }

  alert("ไม่อนุมัติภารกิจแล้ว");

  loadSubmissions();
}


loadSubmissions();

</script>

</body>
</html>
